<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danielle · NewJeans Fan Board</title>
  <meta name="description" content="Danielle of NewJeans: profile, facts and concept photos. Unofficial fan page." />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="icon" href="newjeans.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/member.css" />
</head>
<body data-member="danielle">
  <a class="skip-link" href="#profile">Skip to profile</a>

  <!-- Y2K custom cursor + trailing bead -->
  <div class="y2k-cursor" id="y2k-cursor" aria-hidden="true">
    <span class="y2k-cursor__dot"></span>
    <span class="y2k-cursor__ring"></span>
  </div>

  <!-- Powerpuff bead field (pink / blue / lime) -->
  <div class="beadfield" id="beadfield" aria-hidden="true"></div>

  <!-- pixel grain + scanline (screen texture) -->
  <div class="screen-fx" aria-hidden="true">
    <div class="screen-fx__grain"></div>
    <div class="screen-fx__scan"></div>
  </div>

  <!-- oversized, faded silhouette of the member behind the page -->
  <div class="silhouette" id="silhouette" aria-hidden="true"></div>

  <header class="topbar" aria-label="NewJeans fan board">
    <a class="topbar__name" href="index.html">NEWJEANS</a>
    <nav class="topbar__nav">
      <a href="index.html#members">Members</a>
      <a href="index.html#releases">Music</a>
      <a href="index.html#gallery">Gallery</a>
    </nav>
  </header>

  <main>
    <div class="profile-shell" style="padding:0 var(--pad)">
      <a class="backlink" href="index.html#members">← All members</a>
    </div>

    <section class="profile" id="profile" aria-labelledby="pf-name">
      <figure class="profile__portrait">
        <img id="pf-portrait" src="favicon.png" alt="" />
      </figure>

      <div class="profile__meta">
        <p class="profile__eyebrow" id="pf-eyebrow"></p>
        <h1 class="profile__name" id="pf-name"></h1>
        <p class="profile__hangul" id="pf-hangul"></p>
        <p class="profile__blurb" id="pf-blurb"></p>
        <p class="profile__bio" id="pf-bio"></p>
        <ul class="profile__facts" id="pf-facts"></ul>
        <nav class="profile__nav" id="pf-nav" aria-label="Member navigation"></nav>
      </div>
    </section>

    <section class="profile-gallery" aria-labelledby="pf-gal-h">
      <h2 id="pf-gal-h" class="section-num"><span>The board</span> <span id="pf-count"></span></h2>
      <ul class="profile-gallery__grid" id="pf-grid" role="list"></ul>
    </section>
  </main>

  <footer class="foot">
    <p class="foot__note">Unofficial fan page. Made as a frontend practice build.</p>
    <p class="foot__credit">Photos: compiled from public fan archives (kprofiles.com). Facts: public sources.</p>
    <p class="foot__sig">NEWJEANS · <span id="foot-year"></span></p>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox__close" id="lb-close" aria-label="Close">×</button>
    <button class="lightbox__prev" id="lb-prev" aria-label="Previous">‹</button>
    <figure class="lightbox__fig">
      <img id="lb-img" src="favicon.png" alt="" />
      <figcaption id="lb-cap"></figcaption>
    </figure>
    <button class="lightbox__next" id="lb-next" aria-label="Next">›</button>
  </div>

  <script src="js/data.js"></script>
  <script src="js/member.js"></script>
  <script src="js/immersive.js"></script>
  <script>document.getElementById('foot-year').textContent = new Date().getFullYear();</script>
</body>
</html>
